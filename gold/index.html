<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f1419"/>
<title>黄金纸盘</title>
<link rel="apple-touch-icon" href="icon180.png"/>
<style>
:root{
  --bg:#0f1419;--card:#1a222d;--line:#2a3544;--tx:#e8eef7;--mut:#8b98a8;
  --good:#3ecf8e;--bad:#ff6b6b;--warn:#f0b429;--acc:#5b8cff;
  --pill:#243041;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,20,25,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.ib{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;font-size:13px}
.sub{margin-top:6px;font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{padding:12px 14px 40px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.pill.spike{border-color:var(--bad);color:#ffb4b4}
.pill.chop{border-color:var(--mut);color:var(--mut)}
.pill.normal{border-color:var(--acc);color:#a8c4ff}
.pill.closed{opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:11.5px;color:var(--mut)}
.kpi .up{color:var(--good)}.kpi .dn{color:var(--bad)}
.blk{font-size:12px;color:var(--mut);margin:16px 0 8px;text-transform:none;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.card .meta{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.card .ttl{font-size:15px;font-weight:600}
.card .det{font-size:13px;color:var(--mut);margin-top:4px}
.card.warn{border-left:4px solid var(--warn)}
.card.crit{border-left:4px solid var(--bad)}
.card.info{border-left:4px solid var(--acc)}
.pos .side{font-weight:700}
.pos .side.LONG{color:var(--good)}.pos .side.SHORT{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:4px}
.miss{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.foot{margin-top:22px;font-size:11.5px;color:var(--mut);line-height:1.5}
.lock{min-height:70vh;display:grid;place-items:center;padding:24px}
.lock box{display:block;width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.lock h2{margin:0 0 8px;font-size:18px}
.lock p{margin:0 0 14px;color:var(--mut);font-size:13px}
.lock input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#121820;color:var(--tx);font-size:15px;margin-bottom:10px}
.lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1.2em}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#243041;color:var(--mut)}
.tag.paper{color:#a8c4ff;border:1px solid #3a5080}
.tag.lock{color:#ffb4b4;border:1px solid #803a3a}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PATH_ID='666778631308897b9ac29819';
const BLOB_DEFAULT=`d/${PATH_ID}/gold.bin`;
const LS_PASS='gold_dv_p', LS_URL='gold_dv_u';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const S={data:null};

(function(){const m=location.hash.match(/u=([^&]+)/);if(m){localStorage.setItem(LS_URL,decodeURIComponent(m[1]));history.replaceState(null,'',location.pathname+(location.search||''))}})();

async function fetchBlob(){
  const u=localStorage.getItem(LS_URL);
  // prefer relative gold.bin under same path-id; allow override
  let uu=u||BLOB_DEFAULT;
  // when served from /daya-board/gold/, ../d/... works
  if(!u) uu='../'+BLOB_DEFAULT;
  const r=await fetch(uu+(uu.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('取数据失败（'+r.status+'）');
  return new Uint8Array(await r.arrayBuffer());
}
async function open_(b,pass){
  if(String.fromCharCode(...b.slice(0,4))!=='DB01') throw new Error('数据格式不对');
  const it=new DataView(b.buffer,b.byteOffset).getUint32(4);
  const salt=b.slice(8,24), iv=b.slice(24,36), ct=b.slice(36);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt; try{ pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct) }catch(e){ throw new Error('口令不对') }
  const stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text=await new Response(stream).text();
  return JSON.parse(text);
}

function fmtTs(ts){
  if(!ts) return '—';
  try{ return new Date((ts<1e12?ts*1000:ts)).toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}).replace('T',' ').slice(5,16) }
  catch(e){ return '—' }
}
function fmtNum(n,d=2){ if(n==null||Number.isNaN(+n)) return '—'; return (+n).toFixed(d) }
function pnlCls(n){ if(n==null) return ''; return n>=0?'up':'dn' }
function regimeLab(n){ n=(n||'normal').toLowerCase(); return n==='spike'?'急波动':n==='chop'?'横盘':'正常' }
function levelLab(lv){ return lv==='crit'?'严重':lv==='warn'?'警告':'提示' }
function kindLab(k){ return k==='news'?'新闻':k==='vol'?'波动':k==='session'?'时段':(k||'—') }

function lockView(err=''){
  $('#app').innerHTML=`<div class="lock"><box>
    <h2>黄金纸盘</h2>
    <p>与 GS 同一套外网加密快照口令。纸盘 PAPER，LIVE 已锁定。</p>
    <input id="pw" type="password" placeholder="输入口令" autocomplete="current-password"/>
    <button type="button" id="go">解锁</button>
    <div class="err" id="err">${esc(err)}</div>
  </box></div>`;
  const go=async()=>{
    const pass=$('#pw').value;
    $('#err').textContent='解密中…';
    try{
      const b=await fetchBlob();
      S.data=await open_(b,pass);
      localStorage.setItem(LS_PASS, pass);
      render();
    }catch(e){ $('#err').textContent=e.message||String(e) }
  };
  $('#go').onclick=go;
  $('#pw').onkeydown=e=>{ if(e.key==='Enter') go() };
  setTimeout(()=>$('#pw').focus(),50);
}

function header(){
  const D=S.data||{}, rg=(D.regime&&D.regime.name)||'normal', sess=D.session||{};
  return `<header>
    <div class="top"><h1>黄金纸盘</h1><button class="ib" type="button" id="btnReload">刷新</button></div>
    <div class="sub">
      <span class="pill ${esc(rg)}">${esc(regimeLab(rg))} · ×${esc(fmtNum(D.regime&&D.regime.margin_mult,1))}</span>
      <span class="pill ${sess.tradable?'':'closed'}">${esc(sess.mode||'—')}${sess.reason?' · '+esc(sess.reason):''}</span>
      <span class="tag paper">PAPER</span>
      <span class="tag lock">LIVE 锁</span>
    </div>
  </header>`;
}

function kpi(){
  const D=S.data||{};
  return `<div class="grid">
    <div class="kpi"><span>权益</span><b>${esc(fmtNum(D.equity,2))}</b></div>
    <div class="kpi"><span>现金</span><b>${esc(fmtNum(D.cash,2))}</b></div>
    <div class="kpi"><span>日内盈亏</span><b class="${pnlCls(D.day_pnl)}">${esc(fmtNum(D.day_pnl,2))}</b></div>
    <div class="kpi"><span>累计盈亏</span><b class="${pnlCls(D.pnl)}">${esc(fmtNum(D.pnl,2))}</b></div>
  </div>
  <div class="card">
    <div class="meta"><span>${esc(D.instrument||'XAU')}</span><span>${esc(D.pos_badge||'—')}</span><span>价 ${esc(fmtNum(D.mkt&&D.mkt.price,2))}</span><span>信号 ${esc((D.mkt&&D.mkt.signal)||'—')}</span></div>
    <div class="det">${esc((D.session&&D.session.sh)||'')} · 快照 ${esc((D.at||'').replace('T',' ').slice(5,16))} CST</div>
  </div>`;
}

function alertsBlock(){
  const rows=(S.data.alerts||[]);
  if(!rows.length) return `<div class="blk">告警</div><div class="miss">暂无告警（敏感新闻 / 急波动出现后会写进这里；周末休市时可能为空）</div>`;
  return `<div class="blk">告警 · ${rows.length}</div>`+rows.map(a=>`<div class="card ${esc(a.level||'info')}">
    <div class="meta"><span>${esc(levelLab(a.level))}</span><span>${esc(kindLab(a.kind))}</span><span>${esc(fmtTs(a.ts))}</span>${a.sym?`<span>${esc(a.sym)}</span>`:''}</div>
    <div class="ttl">${esc(a.title||'')}</div>
    ${a.detail?`<div class="det">${esc(a.detail)}</div>`:''}
  </div>`).join('');
}

function openBlock(){
  const rows=S.data.open||[];
  if(!rows.length) return `<div class="blk">持仓</div><div class="miss">当前空仓</div>`;
  return `<div class="blk">持仓 · ${rows.length}</div>`+rows.map(t=>`<div class="card pos">
    <div class="meta"><span class="side ${esc(t.side)}">${esc(t.side)}</span><span>${esc(t.sym)}</span><span>进场 ${esc(fmtTs(t.ts_in))}</span></div>
    <div class="row"><span>开仓价 ${esc(fmtNum(t.p_in,2))}</span><span>保证金 ${esc(fmtNum(t.margin,2))}</span></div>
  </div>`).join('');
}

function closedBlock(){
  const rows=S.data.closed||[];
  if(!rows.length) return `<div class="blk">近期平仓</div><div class="miss">还没有平仓记录</div>`;
  return `<div class="blk">近期平仓</div>`+rows.map(t=>`<div class="card">
    <div class="meta"><span class="side ${esc(t.side)}">${esc(t.side)}</span><span>${esc(t.sym)}</span><span>${esc(fmtTs(t.ts_out))}</span><span>${esc(t.reason||'')}</span></div>
    <div class="row"><span>${esc(fmtNum(t.p_in,2))} → ${esc(fmtNum(t.p_out,2))}</span><span class="${pnlCls(t.pnl)}">${esc(fmtNum(t.pnl,4))}</span></div>
  </div>`).join('');
}

function newsBlock(){
  const rows=S.data.news||[];
  if(!rows.length) return `<div class="blk">新闻摘要</div><div class="miss">暂无可用新闻标题（源失败时不展示错误条）</div>`;
  return `<div class="blk">新闻摘要</div>`+rows.map(n=>`<div class="card">
    <div class="meta"><span>${esc(n.publisher||n.src||'—')}</span><span>${esc(fmtTs(n.ts))}</span></div>
    <div class="ttl" style="font-weight:500;font-size:14px">${esc(n.title)}</div>
  </div>`).join('');
}

function render(){
  const D=S.data; if(!D){ lockView(); return; }
  $('#app').innerHTML=header()+`<main>
    ${kpi()}
    ${alertsBlock()}
    ${openBlock()}
    ${closedBlock()}
    ${newsBlock()}
    <div class="foot">${esc(D.note||'纸盘 PAPER · LIVE 锁定')}<br/>与 GS 足球板分开；口令相同；点刷新重新拉 gold.bin</div>
  </main>`;
  $('#btnReload').onclick=()=>reload(true);
}

async function reload(forcePass){
  const pass=localStorage.getItem(LS_PASS);
  if(!pass){ lockView(); return; }
  try{
    const b=await fetchBlob();
    S.data=await open_(b,pass);
    render();
  }catch(e){
    if(forcePass || /口令|格式/.test(e.message||'')){ localStorage.removeItem(LS_PASS); lockView(e.message); }
    else lockView(e.message);
  }
}

reload(false);
</script>
</body>
</html>
